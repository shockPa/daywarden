<svg xmlns="http://www.w3.org/2000/svg" width="440" height="520" viewBox="0 0 290 330" role="img" aria-labelledby="title desc">
  <title id="title">Daywarden logo mark</title>
  <desc id="desc">A deep navy D-shaped daily logbook with a softly curved white page, five colored day-status dots, and three note lines.</desc>

  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7367"/>
      <stop offset="1" stop-color="#F04F49"/>
    </linearGradient>
    <linearGradient id="apricot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFAA4C"/>
      <stop offset="1" stop-color="#F5912E"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFDD5A"/>
      <stop offset="1" stop-color="#F4C832"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8D686"/>
      <stop offset="1" stop-color="#8FC869"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42C27B"/>
      <stop offset="1" stop-color="#22A960"/>
    </linearGradient>
  </defs>

  <!-- The bold D / book cover -->
  <path
    d="M72 40H160
       C228 40 273 95 273 177
       C273 260 228 314 163 314
       H72
       C60 314 53 306 53 295
       V59
       C53 48 61 40 72 40Z"
    fill="#011B40"/>

  <!-- The page: intentionally organic at the top, like the concept artwork -->
  <path
    d="M80 66
       C105 77 127 81 153 79
       C205 76 242 116 242 178
       C242 241 208 284 154 284
       H84
       C81 284 79 282 79 279
       V73
       C79 69 79 67 80 66Z"
    fill="#FFFDFC"/>

  <!-- Day / mood scale -->
  <circle cx="107" cy="119" r="11.5" fill="url(#coral)"/>
  <circle cx="107" cy="154" r="11.5" fill="url(#apricot)"/>
  <circle cx="107" cy="189" r="11.5" fill="url(#yellow)"/>
  <circle cx="107" cy="224" r="11.5" fill="url(#sage)"/>
  <circle cx="107" cy="259" r="11.5" fill="url(#green)"/>

  <!-- Notes -->
  <g fill="none" stroke="#C9CACB" stroke-width="6" stroke-linecap="round">
    <path d="M138 141H210"/>
    <path d="M138 176H210"/>
    <path d="M138 211H210"/>
  </g>
</svg>
